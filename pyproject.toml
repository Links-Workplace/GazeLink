[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gazelink"
version = "0.1.0"
description = "Local, safety-first eye tracking and eye control for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "LicenseRef-Proprietary"
authors = [{ name = "GAZELINK" }]
dependencies = [
    "mediapipe>=0.10.21,<0.11",
    "numpy>=1.26,<2",
    "opencv-python>=4.10,<5",
    "PySide6>=6.8,<7",
]

[project.optional-dependencies]
# EyeGestures is GPL-3.0 while this project is proprietary, so it is kept OUT
# of the default dependency closure and imported lazily behind
# `--engine eyegestures`. Installing this extra is an internal-use decision;
# distributing GAZELINK together with it would trigger GPL-3 copyleft. See the
# "GPL-3 obligation" note in TASKS.md before shipping anything that bundles it.
# The mediapipe ceiling is required, not cosmetic: 0.10.30+ removed the legacy
# `mp.solutions` API that EyeGestures depends on.
eyegestures = [
    "eyeGestures>=3.2,<4",
    "scikit-learn>=1.3,<2",
    "mediapipe>=0.10.21,<0.10.30",
]
dev = [
    "mypy>=1.14,<2",
    "pip-tools>=7.4,<8",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[project.scripts]
gazelink = "gazelink.app:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=gazelink --cov-report=term-missing -p support.pytest_safety"
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "unit: deterministic unit test with no external device or operating-system input",
    "integration: deterministic multi-component test using fakes only",
    "hardware: requires an explicitly enabled physical-device test session",
    "performance: requires an explicitly enabled manual benchmark or accuracy session",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "analyze.py", "export_test_targets.py"]

# EyeGestures ships no type information and is an optional extra, so the exact
# error it raises differs by environment ("import-not-found" when the extra is
# absent, "import-untyped" when it is installed). Declaring it here keeps the
# type check identical either way, instead of an inline ignore that is only
# correct on machines that happen to match.
[[tool.mypy.overrides]]
module = ["eyeGestures.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["gazelink"]

[tool.coverage.report]
show_missing = true
