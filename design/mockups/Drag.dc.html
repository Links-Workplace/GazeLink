<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>גרירה</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&amp;family=Heebo:wght@500;700;900&amp;display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #0E0F11; font-family: Assistant, system-ui, sans-serif; }
a { color: #D4A24C; } a:hover { color: #F0CC7E; }
.gz-b { appearance: none; cursor: pointer; font-family: inherit; }
.gz-b:hover { border-color: #D4A24C; }
</style>
</helmet>
<div style="width: 2400px; height: 675px; box-sizing: border-box; position: relative; overflow: hidden; background: #FBFAF7;" dir="rtl">

  <div style="position: absolute; inset: 0; box-sizing: border-box; padding: 22px 44px; color: #2B2E34;">
    <div style="font-size: 21px; font-weight: 700; color: #4A4E57;">לוח משימות</div>
    <div style="margin-top: 18px; display: flex; gap: 40px;">
      <div style="width: 420px; padding: 14px; border-radius: 12px; background: #F1EFE9;">
        <div style="font-size: 17px; font-weight: 700; color: #6A6E77; margin-bottom: 10px;">לעשות</div>
        <div style="height: 54px; border-radius: 10px; background: {{aBg}}; border: 3px {{aStyle}} {{aEdge}}; box-sizing: border-box;"></div>
        <div style="height: 54px; margin-top: 10px; border-radius: 10px; background: #FFFFFF;"></div>
      </div>
      <div style="width: 420px; padding: 14px; border-radius: 12px; background: #F1EFE9;">
        <div style="font-size: 17px; font-weight: 700; color: #6A6E77; margin-bottom: 10px;">בתהליך</div>
        <div style="height: 54px; border-radius: 10px; background: #FFFFFF;"></div>
        <div style="height: 54px; margin-top: 10px; border-radius: 10px; background: {{bBg}}; border: 3px {{bStyle}} {{bEdge}}; box-sizing: border-box;"></div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 26px; width: 1400px; display: flex; justify-content: center;">
    <div style="background: #14161A; border-radius: 999px; padding: 12px 30px;">
      <span style="font-family: Heebo, sans-serif; font-size: 25px; font-weight: 500; color: #F4F3F0;">{{say}}</span>
    </div>
  </div>

  <div style="position: absolute; left: 1440px; top: 17px; width: 240px; height: 67px; box-sizing: border-box; border-radius: 12px; background: #14161A; border: 3px solid #4C525C; display: flex; align-items: center; justify-content: center; gap: 12px;">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path d="M9 5v14M15 5v14" fill="none" stroke="#F4F3F0" stroke-width="2.6" stroke-linecap="round"></path>
    </svg>
    <span style="font-family: Heebo, sans-serif; font-size: 24px; font-weight: 700; color: #F4F3F0;">השהיה</span>
  </div>

  <div style="position: absolute; left: {{cursorX}}px; top: {{cursorY}}px; width: 128px; height: 128px; pointer-events: none;">
    <svg viewBox="0 0 128 128" style="width: 128px; height: 128px;" aria-hidden="true">
      <circle cx="64" cy="64" r="44" fill="rgba(77,163,255,0.14)"></circle>
      <circle cx="64" cy="64" r="44" fill="none" stroke="#C9D9EC" stroke-width="8"></circle>
      <circle cx="64" cy="64" r="44" fill="none" stroke="#2F6FD0" stroke-width="8" pathLength="100" stroke-dasharray="{{dash}} 100" stroke-linecap="round" transform="rotate(-90 64 64)"></circle>
      <circle cx="64" cy="64" r="13" fill="#2F6FD0"></circle>
    </svg>
  </div>

  <sc-if value="{{holding}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; left: 1064px; top: 430px; display: flex; align-items: center; gap: 12px; background: #14161A; border: 3px solid #D4A24C; border-radius: 999px; padding: 8px 22px;">
      <svg viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">
        <path d="M10 3v14M3 10h14M7.2 6.8L10 4l2.8 2.8M13.2 13.2L10 16l-2.8-2.8" fill="none" stroke="#D4A24C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <span style="font-family: Heebo, sans-serif; font-size: 21px; font-weight: 700; color: #F0CC7E;">הפריט מוחזק</span>
    </div>
  </sc-if>

  <sc-for list="{{buttons}}" as="b" hint-placeholder-count="2">
    <button type="button" class="gz-b" onClick="{{b.go}}" style="position: absolute; left: {{b.left}}px; top: 513px; width: 168px; height: 101px; box-sizing: border-box; border-radius: 14px; background: {{b.bg}}; border: 3px solid {{b.edge}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      {{b.icon}}
      <span style="font-family: Heebo, sans-serif; font-size: 21px; font-weight: 700; color: {{b.ink}};">{{b.label}}</span>
    </button>
  </sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2400,"height":675}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 0 };
  }
  icon(name, ink) {
    var R = window.React;
    var s = { stroke: ink, fill: 'none', strokeWidth: 2.2, strokeLinecap: 'round', strokeLinejoin: 'round' };
    function p(d, k) { return R.createElement('path', Object.assign({ d: d, key: k }, s)); }
    var sets = {
      pick: [p('M5 3v13l3.4-3.4 2.2 5 2.6-1.1-2.2-5 4.8-.4z', 'a')],
      drop: [p('M10 3v9', 'a'), p('M6.5 8.5L10 12l3.5-3.5', 'b'), p('M4 16h12', 'c')],
      ok: [R.createElement('circle', Object.assign({ cx: 10, cy: 10, r: 7.5, key: 'a' }, s)), p('M6.6 10.2l2.4 2.4 4.4-4.8', 'b')],
      x: [p('M6 6l8 8M14 6l-8 8', 'a')]
    };
    return R.createElement('svg', { viewBox: '0 0 20 20', width: 30, height: 30, 'aria-hidden': 'true' }, sets[name]);
  }
  renderVals() {
    var self = this;
    var step = this.state.step;
    var GOLD = '#D4A24C', DARK = '#14161A', LINE = '#4C525C', TEXT = '#F4F3F0';
    var says = ['בחר פריט', 'בחר מקום להנחה', 'בוצע'];
    var primary = [
      { label: 'בחר', ic: 'pick' },
      { label: 'הנח כאן', ic: 'drop' },
      { label: 'סיום', ic: 'ok' }
    ][step];
    var second = step === 2 ? null : { label: 'ביטול', ic: 'x' };
    var defs = [
      {
        label: primary.label, ic: primary.ic, primary: true,
        go: function () { self.setState({ step: step === 2 ? 0 : step + 1 }); }
      }
    ];
    if (second) {
      defs.push({ label: second.label, ic: second.ic, primary: false, go: function () { self.setState({ step: 0 }); } });
    }
    var lefts = [1476, 756];
    return {
      say: says[step],
      holding: step === 1,
      dash: step === 0 ? 58 : 0,
      cursorX: step === 0 ? 1206 : 686,
      cursorY: step === 0 ? 96 : 224,
      aBg: step === 0 ? '#FFF7E6' : '#FFFFFF',
      aEdge: step === 0 ? GOLD : '#E0DCD2',
      aStyle: step === 0 ? 'solid' : 'dashed',
      bBg: step === 1 ? '#FFF7E6' : (step === 2 ? '#EAF7F0' : '#FFFFFF'),
      bEdge: step === 1 ? GOLD : (step === 2 ? '#4FAE7C' : '#E0DCD2'),
      bStyle: step === 1 ? 'dashed' : 'solid',
      buttons: defs.map(function (d, i) {
        return {
          label: d.label,
          icon: self.icon(d.ic, d.primary ? '#14161A' : TEXT),
          left: lefts[i],
          bg: d.primary ? '#F0CC7E' : DARK,
          edge: d.primary ? GOLD : LINE,
          ink: d.primary ? '#14161A' : TEXT,
          go: d.go
        };
      })
    };
  }
}
</script>
</body>
</html>
